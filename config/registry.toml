# Auli — registro ÚNICO de entidades e coleções.
#
# ESTE ARQUIVO É CATÁLOGO, NÃO DADO: o ponto onde o vocabulário do código encontra o inventário de
# `data/`. Mora em `config/` para o adotante achá-lo — é por aqui que se adapta o Auli para outra
# organização, sem recompilar nada.
#
# ── Adaptando para a sua organização ─────────────────────────────────────────────────────────────
# ENTIDADE NOVA (outra secretaria, outro órgão) = três passos, zero código:
#   1. um bloco `[[entities]]` aqui;
#   2. `config/prompts/<id>.txt` com as instruções do LLM para ela;
#   3. `data/<id>/` com o conteúdo (o scraper produz; ver crates/scrapers/SCRAPERS.md).
#   Depois: `node scripts/gen-frontend-entities.mjs` (o frontend lê um espelho gerado daqui).
#
# COLEÇÃO NOVA (outro tipo de documento, além de serviços/faqs/pareceres/tarf) ainda EXIGE código —
# uma variante no enum `Kind` do auli-contract e uma projeção. É pequeno desde a TAREFA-DOCUMENTO
# (ver docs/ESTUDO-colecoes-trait.md), mas não é configuração. Dizer o contrário aqui seria mentir
# para quem está avaliando adotar.
#
# FONTE DA VERDADE compartilhada. É lida por:
#   - auli-cli  (server): entidades carregadas + prompt por entidade
#   - auli-collections (scraper): entidades válidas + diretório de saída
#   - auli-frontend: gerado por scripts/gen-frontend-entities.mjs -> src/shared/entities.ts
# Editar AQUI; nunca duplicar a lista de entidades em código.
#
# Campos por entidade:
#   id          identificador estável (também a pasta data/<id>/ e a chave de tenant)
#   name        nome exibido (ex.: "SEFAZ-RS")
#   uf          sigla do estado (ex.: "RS")
#   state       nome do estado por extenso
#   prompt      caminho do system prompt, relativo A ESTA PASTA (`config/`) — não à `data/`
#   collections rótulos de coleção da UI. `servicos` é o kind vetorial `servicos` (unificado — não
#               existe mais `services`); `conteudos` é só de referência (sem kind vetorial, sem
#               scraper); `legislacao` é a única cuja árvore tem subpastas — uma por lei.

[[entities]]
id = "rs"
name = "SEFAZ-RS"
uf = "RS"
state = "Rio Grande do Sul"
prompt = "prompts/rs.txt"
# Prompt específico para consultas de pareceres (query type=2). Opcional: entidades sem este campo
# usam o prompt-padrão de pareceres. Campos de UI (uf/state/collections) são ignorados pelo backend.
prompt_pareceres = "prompts/rs-pareceres.txt"
# Prompt das consultas ao TARF (query type=3). Opcional: sem ele, a entidade cai no próprio
# `prompt_pareceres` — acórdão também é jurisprudência, e as instruções de citar número e link valem
# igual. O texto próprio existe para dizer o que só vale ali: um acórdão decide um caso concreto, não
# é norma geral.
prompt_tarf = "prompts/rs-tarf.txt"
# Prompt das consultas de legislação (query type=4). Opcional: sem ele, a entidade cai no default
# GLOBAL de legislação — e não no `prompt_pareceres` dela, como faz o TARF. O motivo é que acórdão
# sem prompt próprio ainda é jurisprudência, e legislação não é: cair no de pareceres mandaria o
# modelo citar "o número do parecer" sobre um texto de lei.
prompt_legislacao = "prompts/rs-legislacao.txt"
# `tarf` é a coleção dos acórdãos do Tribunal Administrativo de Recursos Fiscais. Ela dirige DUAS
# coisas: a aba de listagem (que lê o `rs-tarf-index.json`) e a fonte "Acórdãos TARF" do chat (que lê
# o pack vetorial `rs-tarf`).
# Esta linha é o interruptor das duas: tirá-la daqui (e rodar gen-frontend-entities.mjs) as desliga.
#
# `legislacao` é a coleção dos pares pergunta/resposta sobre o texto das leis, e é o mesmo tipo de
# interruptor: liga a aba de listagem e a fonte "Legislação" do chat (pack vetorial `rs-legislacao`).
# É a primeira coleção com árvore em subpastas — uma por lei.
collections = ["servicos", "faqs", "pareceres", "notas", "conteudos", "tarf", "legislacao"]

[[entities]]
id = "sc"
name = "SEF-SC"
uf = "SC"
state = "Santa Catarina"
prompt = "prompts/sc.txt"
prompt_pareceres = "prompts/sc-pareceres.txt"
collections = ["servicos", "pareceres"]

