name: registry-sync

# Guard-rail barato: garante que config/registry.toml continua sendo a fonte única de entidades
# (frontend em dia + sem cópias fora do registry). Não compila Rust (fastembed/ort são pesados);
# o build/test Rust roda localmente (ver docs/auli_operations.md).
#
# SEM filtro de `paths`, de propósito: workflow que não dispara não cria check run, e check
# OBRIGATÓRIO que nunca reporta trava a PR em "Expected" para sempre. Como o guarda custa ~12s,
# rodar sempre sai mais barato que a engenharia para contornar.
#
# Isso ATENDE, e de forma mais simples, o motivo pelo qual o filtro antigo listava
# `auli-server/entities/**` e `auli-server/crates/auli-collections/src/entities/**` — dirs que não
# existem, listados para que o workflow disparasse SE reaparecessem (check #2 do script). Sem
# filtro nenhum, ele dispara sempre, então o padrão que se quer barrar é pego de qualquer jeito.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Nome do job = nome do check obrigatório. Distinto entre os workflows por isso.
  registry-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: registry sync guard
        run: bash scripts/check-registry-sync.sh
