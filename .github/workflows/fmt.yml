name: fmt

# Guarda da formatação: `cargo fmt --check` no workspace inteiro. Existe porque o repo passou
# meses sem esse guarda e acumulou 723 divergências — cada crate tocado colhia um pedaço da
# dívida e virava ruído no diff (ver docs/auli_pendencias.md §28).
#
# Barato pelo mesmo critério do scraper-boundary: o rustfmt PARSEIA, não compila — nada de
# fastembed/ort. O build/test continua rodando localmente.
#
# O workspace é `auli-server/`, não a raiz do repo, daí o `--manifest-path`.
#
# SEM filtro de `paths`, de propósito (era `auli-server/**/*.rs` + Cargo.toml): workflow que não
# dispara não cria check run, e check OBRIGATÓRIO que nunca reporta trava a PR em "Expected" para
# sempre. Como o guarda custa ~12s, rodar sempre sai mais barato que a engenharia para contornar.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Nome do job = nome do check obrigatório. Distinto entre os workflows por isso.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustfmt disponível
        run: rustup component add rustfmt && cargo fmt --version
      - name: cargo fmt --check
        run: cargo fmt --all --manifest-path auli-server/Cargo.toml -- --check
