[package]
name = "auli-scraper-kit"
version = "0.1.0"
edition = "2024"

# Apoio compartilhado dos scrapers — o COMO raspar: cache de páginas, HTTP com retry, limpeza de
# texto, builder do agent ureq, a agregação de serviços e a árvore de FAQs do frontend. A fronteira
# (tipos + I/O do snapshot) mora no `auli-contract` (D-C1). Exclusivo de `crates/scrapers/`; NUNCA
# depende de fastembed/ort/vector-store.
[dependencies]
auli-contract = { path = "../../auli-contract" }
ureq = { version = "3", features = ["json"] }
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `html`: o conversor HTML → texto das FAQs (D-KITHTML-1) — regex sobre o HTML cru, entidades pelo html5ever.
regex = "1"
scraper = "0.27.0"
