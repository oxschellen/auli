[package]
name = "auli-scraper-rj"
version = "0.1.0"
edition = "2024"

# Scraper da SEFAZ-RJ (serviços, catálogo "Nossos Serviços" — WordPress server-rendered, UMA página).
# Desde 11/2026 o portal só serve a página a um navegador que execute o desafio JavaScript da proteção
# anti-robô: o catálogo vem por um Chromium headless (`headless_chrome`, o Chromium do Playwright) —
# a ÚNICA exceção da frota à regra "sem navegador headless" (D-RJ-WAF, docs/auli_pendencias.md §43).
# Antes, 1 GET pelo ureq: se o portal voltar a servir a página, o navegador nem abre. Depende de
# auli-contract + o kit — nunca de fastembed/ort. Decisões D-RJ1..5 em docs/auli_pendencias.md.
[dependencies]
auli-contract = { path = "../../auli-contract" }
auli-scraper-kit = { path = "../auli-scraper-kit" }
ureq = "3"
scraper = "0.27.0"
anyhow = "1"
headless_chrome = "1.0.22"
